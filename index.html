<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#222222">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dar en Línea">
  <link rel="apple-touch-icon" sizes="180x180" href="AR-Churchlogo.png">
  <link rel="manifest" href="manifest.json">
  <title>Dar en Línea | Iglesia Amor y Restauración</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#222}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:430px;background:white;border-radius:28px;padding:34px 24px 28px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.10)}
    .icon{width:86px;height:86px;border-radius:22px;margin:0 auto 18px}
    h1{font-size:27px;margin:0 0 7px}
    .church{font-size:16px;margin:0 0 28px;color:#666}
    .give{display:block;text-decoration:none;background:#222;color:white;font-size:19px;font-weight:700;padding:18px 20px;border-radius:16px;margin-bottom:14px}
    .note{font-size:13px;color:#777;line-height:1.5;margin-top:20px}
    .footer{font-size:12px;color:#999;margin-top:24px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <img class="icon" src="AR-Churchlogo.png" alt="">
      <h1>Dar en Línea</h1>
      <p class="church">Iglesia Amor y Restauración</p>
      <a class="give" href="https://www.zeffy.com/en-US/donation-form/tithes-and-offering-54"> Diezmos y Ofrendas</a>
      <p class="note">Al tocar el botón, serás llevado directamente a nuestra página segura de donaciones.</p>
      <p class="footer">Gracias por apoyar la obra de Dios.</p>
    </section>
  </main>
</body>
</html>
